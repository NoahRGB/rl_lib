

_target_: "rl_lib.algs.a2c.A2C"
lr: 0.0007
tmax: 8
gamma: 0.9
lam: 0.9
entropy_weight: 0.0
cgn: 0.5
value_weight: 0.4
load_path:

net_architecture:
  shared_enc:
    type: "CNN"
    layers:
      - type: "CONV"
        in: "IN"
        out: 16
        kernel: 8
        stride: 4
        activation: "RELU"
      - type: "CONV"
        in: 16
        out: 32
        kernel: 4
        stride: 2
        activation: "RELU"
      - type: "FLATTEN"
      - type: "LINEAR"
        in: 2592
        out: 256
        activation: "RELU"

